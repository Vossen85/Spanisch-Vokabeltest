<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Korrektur – Vokabeltraining</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0;padding:22px}
    .wrap{max-width:980px;margin:0 auto}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px rgba(15,23,42,.05)}
    h1{margin:0 0 6px;font-size:2rem}
    .sub,.tiny{color:#64748b}.tiny{font-size:.9rem}
    .resultbox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
    .resultbox div{background:#f8fafc;border-radius:10px;padding:12px}.resultbox strong{display:block;font-size:1.2rem}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}
    .primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#172033}
    .note{background:#f8fafc;padding:12px 14px;border-radius:10px;margin:14px 0}
    .error{background:#fef2f2;color:#991b1b;padding:14px;border-radius:10px}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e2e8f0;vertical-align:top}
    th{font-size:.88rem;color:#475569}.pts{font-weight:800;white-space:nowrap}
    .wrong{background:#fffafa}.half{background:#fffaf5}
    @media(max-width:700px){body{padding:12px}.card{padding:16px}.resultbox{grid-template-columns:1fr 1fr}table{font-size:.86rem}th,td{padding:7px 5px}}
    @media print{
      @page{size:A4;margin:12mm}
      body{background:#fff;padding:0}.wrap{max-width:none}.card{box-shadow:none;border:0;padding:0;margin:0}
      .no-print{display:none!important}table{font-size:9pt}h1{font-size:18pt}
    }
  
  .avanza-home-header{margin:0 0 12px;line-height:0}
  .avanza-home-link{display:inline-flex;align-items:center;justify-content:center;border-radius:13px;line-height:0;outline-offset:3px}
  .avanza-home-link img{display:block;width:50px;height:50px;object-fit:cover;border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.16)}
  .avanza-home-link:focus-visible{outline:3px solid #2563eb}
  .avanza-home-link:hover img{transform:translateY(-1px)}
  .avanza-home-link.is-locked{opacity:.68;pointer-events:none;cursor:default}
  @media print{.avanza-home-header{display:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="avanza-home-header"><a class="avanza-home-link" href="uebung.html" data-home-target="uebung.html" aria-label="Zur Startseite ¡Avanza!" title="Zur Startseite"><img src="./icons/avanza-schueler.svg" alt="¡Avanza! Startseite"></a></header>
  <section id="loading" class="card"><h1>Korrektur wird geladen …</h1></section>
  <section id="errorCard" class="card" style="display:none"><div id="errorText" class="error"></div></section>

  <section id="content" class="card" style="display:none">
    <h1>Korrektur – Testsimulation</h1>
    <div class="sub">Spanisch – Vokabeltraining</div>

    <div class="resultbox">
      <div><span class="tiny">Punkte</span><strong id="points"></strong></div>
      <div><span class="tiny">Prozent</span><strong id="percent"></strong></div>
      <div><span class="tiny">Note</span><strong id="grade"></strong></div>
      <div><span class="tiny">Oberstufenpunkte</span><strong id="op"></strong></div>
    </div>

    <div class="note"><strong>Bewertung:</strong> 1 Punkt = richtig · 0,5 Punkte = nur Akzent- bzw. Groß-/Kleinschreibungsfehler · 0 Punkte = falsch.</div>

    <div class="actions no-print">
      <button id="printBtn" class="primary">Drucken / als PDF sichern</button>
      <button id="backBtn" class="secondary">Zurück</button>
    </div>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>Nr.</th><th>Deutsch</th><th>Eigene Antwort</th><th>Richtige Lösung</th><th>Punkte</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  const SUPABASE_URL="https://jzolxrqrrljwpmjbdxmo.supabase.co";
  const SUPABASE_KEY="sb_publishable_AGUrdmy8nEQZJlPfgd9qbw_J6xkojrj";
  const $=id=>document.getElementById(id);

  function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
  async function api(body){
    const res=await fetch(SUPABASE_URL+"/functions/v1/practice-test",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      },
      body:JSON.stringify(body)
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.error)throw new Error(data.error||"Korrektur konnte nicht geladen werden.");
    return data;
  }

  async function load(){
    const hash=new URLSearchParams(location.hash.replace(/^#/,""));
    const token=hash.get("token");
    if(!token){showError("Der Korrekturlink ist unvollständig.");return}
    try{
      const data=await api({action:"session",accessToken:token});
      if(!data.submitted||!data.result)throw new Error("Die Testsimulation wurde noch nicht abgegeben.");

      const r=data.result;
      $("points").textContent=r.summary.rawPoints+" / "+r.summary.maxPoints;
      $("percent").textContent=Number(r.summary.percent).toFixed(1)+" %";
      $("grade").textContent=r.summary.gradeText;
      $("op").textContent=r.summary.upperSchoolPoints;

      $("rows").innerHTML=(r.corrections||[]).map(x=>{
        const p=Number(x.points);
        const cls=p===0?"wrong":(p===0.5?"half":"");
        return "<tr class='"+cls+"'>"+
          "<td>"+esc(x.position)+"</td>"+
          "<td>"+esc(x.sourceText)+"</td>"+
          "<td>"+esc(x.responseText||"—")+"</td>"+
          "<td>"+esc((x.acceptedAnswers||[]).join(" / "))+"</td>"+
          "<td class='pts'>"+(p===0.5?"0,5":String(p))+"</td>"+
        "</tr>";
      }).join("");

      $("loading").style.display="none";
      $("content").style.display="block";
    }catch(e){showError(e.message)}
  }

  function showError(msg){
    $("loading").style.display="none";
    $("errorText").textContent=msg;
    $("errorCard").style.display="block";
  }

  $("printBtn").addEventListener("click",()=>window.print());
  $("backBtn").addEventListener("click",()=>history.back());
  load();
</script>
<script src="./student-progress-widget.js"></script>
</body>
</html>
