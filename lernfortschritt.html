<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Lernfortschritt – ¡Avanza!</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:980px;margin:0 auto}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px rgba(15,23,42,.05)}h1{font-size:2rem;margin:0 0 8px}h2{margin:0 0 10px}.sub,.muted{color:#64748b}.hidden{display:none!important}.home-link,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.home-link{background:#e2e8f0;color:#172033;margin:0 0 14px}.hero{background:linear-gradient(125deg,#2563eb,#7c3aed 55%,#c026d3);color:#fff;border:0}.hero p{margin:0;color:#f3e8ff}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:18px}.metric{padding:13px;border-radius:13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24)}.metric span{display:block;font-size:.85rem;opacity:.9}.metric strong{display:block;font-size:1.45rem;margin-top:5px}.week-list{display:grid;gap:14px}.week-card{border:1px solid #dbe2ea;border-radius:16px;padding:17px;background:#fff}.week-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.week-title{font-size:1.15rem;font-weight:850}.week-tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:.82rem;font-weight:750}.week-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:13px 0}.week-metric{padding:10px;border-radius:11px;background:#f1f5f9}.week-metric span{display:block;font-size:.8rem;color:#64748b}.week-metric strong{display:block;margin-top:3px;font-size:1.1rem}.bar{height:9px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#06b6d4,#2563eb)}.compare{margin:9px 0;color:#334155;font-weight:650}.compare.up{color:#15803d}.compare.down{color:#b91c1c}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}.good-box,.focus-box{padding:12px;border-radius:12px}.good-box{background:#ecfdf5;border:1px solid #bbf7d0}.focus-box{background:#fffbeb;border:1px solid #fde68a}.good-box h3,.focus-box h3{margin:0 0 7px;font-size:1rem}.items{margin:0;padding-left:20px}.items li{margin:4px 0}.empty{color:#64748b}.error{color:#b91c1c}.loading{padding:20px;text-align:center;color:#64748b}@media(max-width:680px){body{padding:12px}.panel{padding:16px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.week-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.week-card{padding:14px}}@media(prefers-color-scheme:dark){:root{color:#f1f5f9;background:#111827}.panel,.week-card{background:#1f2937;border-color:#475569;color:#f1f5f9}.home-link{background:#374151;color:#f9fafb}.week-metric{background:#111827}.compare{color:#cbd5e1}.good-box{background:#064e3b;border-color:#047857}.focus-box{background:#713f12;border-color:#a16207}}
</style></head><body><main class="wrap">
<header class="avanza-home-header"><a class="avanza-home-link" href="uebung.html?personalisiert=1" aria-label="Zur Lernstartseite"><img src="./icons/avanza-schueler.svg" alt="¡Avanza!"></a></header>
<a class="home-link" href="uebung.html?personalisiert=1">← Zurück zum Lernbereich</a>
<section class="panel hero"><h1>Lernfortschritt</h1><p>Deine Lernzeit und Karten-Ergebnisse – nach Wochen geordnet.</p><div id="summary" class="summary"><div class="metric"><span>Diese Woche</span><strong>…</strong></div></div></section>
<section class="panel"><h2>Deine Wochenberichte</h2><div id="weeks" class="week-list"><div class="loading">Deine Lernzeiten und Ergebnisse werden geladen …</div></div><div id="error" class="error"></div></section>
</main><script>
const SUPABASE_URL="https://jzolxrqrrljwpmjbdxmo.supabase.co";
const SUPABASE_KEY="sb_publishable_AGUrdmy8nEQZJlPfgd9qbw_J6xkojrj";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"avanza-student-auth-token",persistSession:true,autoRefreshToken:true}});
window.avanzaStudentClient=client;
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const weekStartDate=value=>new Date(value+"T12:00:00");
const weekLabel=value=>{const start=weekStartDate(value),end=new Date(start);end.setDate(end.getDate()+6);const f=new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});return f.format(start)+"–"+f.format(end)};
const metric=(label,value)=>'<div class="week-metric"><span>'+esc(label)+'</span><strong>'+esc(value)+'</strong></div>';
function answerList(type,title){
 const m=type||{answers:0,correct:0,wrong:0,accuracyPercent:null,missedItems:[]};
 const good=m.answers?title+": "+m.correct+" richtig von "+m.answers+" ("+m.accuracyPercent+" %)":"Noch keine Antworten.";
 const missed=m.missedItems||[];
 return {good,missed};
}
function listHtml(items){return items.length?'<ul class="items">'+items.map(x=>'<li>'+esc(x.label)+(x.count>1?' · '+x.count+'×':'')+'</li>').join("")+'</ul>':'<p class="empty">Keine wiederkehrenden Fehler in diesem Bereich.</p>'}
function render(report){
 const weeks=report.weeks||[],current=weeks[weeks.length-1],summary=document.getElementById("summary");
 const totalAnswers=Number(current?.answers||0),correct=Number(current?.correct||0),minutes=Number(current?.activeMinutes||0),goal=current?.requiredMinutes;
 summary.innerHTML='<div class="metric"><span>Lernzeit diese Woche</span><strong>'+minutes+' Min.</strong></div><div class="metric"><span>Karten bearbeitet</span><strong>'+totalAnswers+'</strong></div><div class="metric"><span>Richtig</span><strong>'+(current?.accuracyPercent==null?'–':current.accuracyPercent+' %')+'</strong></div><div class="metric"><span>Bis zum Wochenziel</span><strong>'+(goal==null?'kein Ziel':Math.max(0,goal-minutes)+' Min.')+'</strong></div>';
 const root=document.getElementById("weeks");
 if(!weeks.length){root.innerHTML='<p class="empty">Noch keine Wochenwerte vorhanden.</p>';return}
 root.innerHTML=[...weeks].reverse().map((w,index)=>{
   const isCurrent=index===weeks.length-1, progress=w.requiredMinutes?Math.min(100,Math.round(w.activeMinutes*100/w.requiredMinutes)):0;
   const compare=w.improvementVsPreviousPoints;
   const compareHtml=compare==null?'': '<div class="compare '+(compare>0?'up':compare<0?'down':'')+'">'+(compare>0?'Trefferquote +'+compare+' Prozentpunkte':compare<0?'Trefferquote '+compare+' Prozentpunkte':'Trefferquote wie in der Vorwoche')+' gegenüber der Vorwoche</div>';
   const vocab=answerList(w.vocab,"Vokabeln"),grammar=answerList(w.grammar,"Grammatik");
   const good=(w.answers?'<p>'+esc(vocab.good)+'</p><p>'+esc(grammar.good)+'</p>':'<p class="empty">In dieser Woche wurden noch keine Kartenantworten gespeichert.</p>');
   const errors=(w.vocab?.missedItems?.length||w.grammar?.missedItems?.length)
     ? '<p><strong>Vokabeln</strong></p>'+listHtml(w.vocab?.missedItems||[])+'<p><strong>Grammatik</strong></p>'+listHtml(w.grammar?.missedItems||[])
     : '<p class="empty">Keine Fehlerkarten gespeichert.</p>';
   return '<article class="week-card"><div class="week-head"><div class="week-title">Woche '+weekLabel(w.weekStart)+'</div>'+(isCurrent?'<span class="week-tag">Diese Woche</span>':'')+'</div><div class="week-metrics">'+metric("Lernzeit",w.activeMinutes+" Min.")+metric("Antworten",w.answers)+metric("Richtig",w.correct)+metric("Fehler",w.wrong)+'</div>'+(w.requiredMinutes?'<div class="muted">Wochenziel: '+w.requiredMinutes+' Min. · noch '+Math.max(0,w.requiredMinutes-w.activeMinutes)+' Min.</div><div class="bar"><span style="width:'+progress+'%"></span></div>':'<div class="muted">Für diese Woche wurde kein Wochenziel eingetragen.</div>')+compareHtml+'<div class="two-col"><section class="good-box"><h3>Das lief gut</h3>'+good+'</section><section class="focus-box"><h3>Noch einmal ansehen</h3>'+errors+'</section></div></article>';
 }).join("");
}
async function load(){
 const {data}=await client.auth.getSession();
 if(!data?.session){location.replace("konto.html?next=report");return}
 const [me,report]=await Promise.all([
   client.functions.invoke("student-progress",{body:{action:"me"}}),
   client.functions.invoke("student-progress",{body:{action:"learning_report"}})
 ]);
 if(me.error||me.data?.error)throw new Error(me.data?.error||me.error?.message||"Konto konnte nicht geladen werden.");
 if(report.error||report.data?.error)throw new Error(report.data?.error||report.error?.message||"Bericht konnte nicht geladen werden.");
 document.querySelector(".hero p").textContent=(me.data.courseName||"Dein Kurs")+" · Deine Lernzeit und Karten-Ergebnisse – nach Wochen geordnet.";
 render(report.data);
}
load().catch(error=>{document.getElementById("weeks").innerHTML="";document.getElementById("error").textContent=error.message});
</script><script src="./student-progress-widget.js"></script></body></html>
