</main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function randomCode(length=8){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=new Uint8Array(length);crypto.getRandomValues(b);return Array.from(b,x=>a[x%a.length]).join("")}

const UIR=new Set(["huir","concluir","construir","destruir","disminuir"]);
const PRESENT_EXACT={
ser:["soy","eres","es","somos","sois","son"],estar:["estoy","estás","está","estamos","estáis","están"],
ir:["voy","vas","va","vamos","vais","van"],dar:["doy","das","da","damos","dais","dan"],
decir:["digo","dices","dice","decimos","decís","dicen"],ver:["veo","ves","ve","vemos","veis","ven"],
oír:["oigo","oyes","oye","oímos","oís","oyen"],tener:["tengo","tienes","tiene","tenemos","tenéis","tienen"],
hacer:["hago","haces","hace","hacemos","hacéis","hacen"],poner:["pongo","pones","pone","ponemos","ponéis","ponen"],
traer:["traigo","traes","trae","traemos","traéis","traen"],saber:["sé","sabes","sabe","sabemos","sabéis","saben"],
venir:["vengo","vienes","viene","venimos","venís","vienen"],salir:["salgo","sales","sale","salimos","salís","salen"],
caer:["caigo","caes","cae","caemos","caéis","caen"],reír:["río","ríes","ríe","reímos","reís","ríen"],
seguir:["sigo","sigues","sigue","seguimos","seguís","siguen"],oler:["huelo","hueles","huele","olemos","oléis","huelen"]

function present(v){
  let [base,ref]=splitReflexive(v);
  if(PRESENT_EXACT[base])return addReflex([...PRESENT_EXACT[base]],ref);
  const cls=base.endsWith("ar")?"ar":base.endsWith("er")?"er":"ir";
  const endings=cls==="ar"?["o","as","a","amos","áis","an"]:cls==="er"?["o","es","e","emos","éis","en"]:["o","es","e","imos","ís","en"];
  let root=base.slice(0,-2),forms=[];
  for(let i=0;i<6;i++){let r=root;
    if(i===0||i===1||i===2||i===5){if(EIE.has(base))r=changeLast(r,"e","ie");if(OUE.has(base))r=changeLast(r,"o","ue");if(UUE.has(base))r=changeLast(r,"u","ue");if(EI.has(base))r=changeLast(r,"e","i")}
    if(UIR.has(base)&&(i===0||i===1||i===2||i===5)){forms.push(i===0?r+"yo":r+"y"+endings[i]);continue}

const GER_EXACT={caer:"cayendo",decir:"diciendo",dormir:"durmiendo",leer:"leyendo",ir:"yendo",morir:"muriendo",oír:"oyendo",poder:"pudiendo",ser:"siendo",traer:"trayendo",venir:"viniendo",ver:"viendo",sentir:"sintiendo",seguir:"siguiendo",construir:"construyendo",destruir:"destruyendo"};
function gerund(v){let [base]=splitReflexive(v);return GER_EXACT[base]||base.slice(0,-2)+(base.endsWith("ar")?"ando":"iendo")}
const PART={abrir:"abierto",cubrir:"cubierto",decir:"dicho",escribir:"escrito",hacer:"hecho",ir:"ido",morir:"muerto",poner:"puesto",romper:"roto",ser:"sido",ver:"visto",volver:"vuelto",describir:"descrito",revolver:"revuelto"};
function participle(v){let [base]=splitReflexive(v);return PART[base]||base.slice(0,-2)+(base.endsWith("ar")?"ado":"ido")}
const INDEF_EXACT={
ser:["fui","fuiste","fue","fuimos","fuisteis","fueron"],ir:["fui","fuiste","fue","fuimos","fuisteis","fueron"],
dar:["di","diste","dio","dimos","disteis","dieron"],ver:["vi","viste","vio","vimos","visteis","vieron"],

leer:["leí","leíste","leyó","leímos","leísteis","leyeron"],oír:["oí","oíste","oyó","oímos","oísteis","oyeron"],reír:["reí","reíste","rió","reímos","reísteis","rieron"]
};
const IRREG_ROOT={estar:"estuv",tener:"tuv",poder:"pud",poner:"pus",hacer:"hic",venir:"vin",querer:"quis",saber:"sup",andar:"anduv",decir:"dij",traer:"traj",traducir:"traduj",producir:"produj",conducir:"conduj",haber:"hub",reducir:"reduj",seducir:"seduj",caber:"cup"};
function indef(v){
  let [base,ref]=splitReflexive(v),forms;
  if(INDEF_EXACT[base])forms=[...INDEF_EXACT[base]];
  else if(IRREG_ROOT[base]){const r=IRREG_ROOT[base],j=r.endsWith("j");forms=[r+"e",r+"iste",base==="hacer"?"hizo":r+"o",r+"imos",r+"isteis",r+(j?"eron":"ieron")]}
  else{const cls=base.endsWith("ar")?"ar":base.endsWith("er")?"er":"ir";const endings=cls==="ar"?["é","aste","ó","amos","asteis","aron"]:["í","iste","ió","imos","isteis","ieron"];let root=base.slice(0,-2);
    forms=endings.map((e,i)=>{let r=root;if(cls==="ir"&&(i===2||i===5)){if(EIE.has(base)||EI.has(base))r=changeLast(r,"e","i");if(OUE.has(base))r=changeLast(r,"o","u")}
      if(i===0&&cls==="ar"){if(base.endsWith("gar"))r=r.slice(0,-1)+"gu";else if(base.endsWith("car"))r=r.slice(0,-1)+"qu";else if(base.endsWith("zar"))r=r.slice(0,-1)+"c"}return r+e})}
  return addReflex(forms,ref);
}
function imperfect(v){let [base,ref]=splitReflexive(v),forms;if(base==="ser")forms=["era","eras","era","éramos","erais","eran"];else if(base==="ir")forms=["iba","ibas","iba","íbamos","ibais","iban"];else if(base==="ver")forms=["veía","veías","veía","veíamos","veíais","veían"];else{const root=base.slice(0,-2);forms=(base.endsWith("ar")?["aba","abas","aba","ábamos","abais","aban"]:["ía","ías","ía","íamos","íais","ían"]).map(x=>root+x)}return addReflex(forms,ref)}
const SUBJ_FULL={dar:["dé","des","dé","demos","deis","den"],estar:["esté","estés","esté","estemos","estéis","estén"],haber:["haya","hayas","haya","hayamos","hayáis","hayan"],ir:["vaya","vayas","vaya","vayamos","vayáis","vayan"],saber:["sepa","sepas","sepa","sepamos","sepáis","sepan"],ser:["sea","seas","sea","seamos","seáis","sean"],caber:["quepa","quepas","quepa","quepamos","quepáis","quepan"]};
const SUBJ_STEM={hacer:"hag",tener:"teng",salir:"salg",caer:"caig",decir:"dig",oír:"oig",poner:"pong",traer:"traig",venir:"veng",valer:"valg",conducir:"conduzc",ofrecer:"ofrezc",construir:"construy",ver:"ve"};
function subjPresent(v){let [base,ref]=splitReflexive(v);if(SUBJ_FULL[base])return addReflex([...SUBJ_FULL[base]],ref);const cls=base.endsWith("ar")?"ar":base.endsWith("er")?"er":"ir",endings=cls==="ar"?["e","es","e","emos","éis","en"]:["a","as","a","amos","áis","an"],forms=[];
 for(let i=0;i<6;i++){let r=base.slice(0,-2);if(SUBJ_STEM[base])r=SUBJ_STEM[base];else if(cls==="ir"&&EIE.has(base))r=changeLast(r,"e",(i===3||i===4)?"i":"ie");else if(cls==="ir"&&OUE.has(base))r=changeLast(r,"o",(i===3||i===4)?"u":"ue");else if(EI.has(base))r=changeLast(r,"e","i");else if((i===0||i===1||i===2||i===5)&&EIE.has(base))r=changeLast(r,"e","ie");else if((i===0||i===1||i===2||i===5)&&OUE.has(base))r=changeLast(r,"o","ue");else if((i===0||i===1||i===2||i===5)&&UUE.has(base))r=changeLast(r,"u","ue");
  if(!SUBJ_STEM[base]){if(base.endsWith("car"))r=r.slice(0,-1)+"qu";else if(base.endsWith("gar"))r=r.slice(0,-1)+"gu";else if(base.endsWith("guar"))r=r.slice(0,-2)+"gü";else if(base.endsWith("ger")||base.endsWith("gir"))r=r.slice(0,-1)+"j";else if(base.endsWith("guir"))r=r.slice(0,-2)+"g";else if(CZC.has(base))r=base.slice(0,-3)+"zc";else if(CZ.has(base))r=r.slice(0,-1)+"z";else if(base.endsWith("zar"))r=r.slice(0,-1)+"c";if(UIR.has(base))r=base.slice(0,-2)+"y"}forms.push(r+endings[i])}return addReflex(forms,ref)}
function subjImperfect(v){let [base,ref]=splitReflexive(v);const ellos=indef(base)[5],stem=ellos.slice(0,-3),sAcc=accentLastVowel(stem);const ra=[stem+"ra",stem+"ras",stem+"ra",sAcc+"ramos",stem+"rais",stem+"ran"],se=[stem+"se",stem+"ses",stem+"se",sAcc+"semos",stem+"seis",stem+"sen"];return addReflex(ra.map((x,i)=>x+" / "+se[i]),ref)}
const HABER={present:["he","has","ha","hemos","habéis","han"],imperfect:["había","habías","había","habíamos","habíais","habían"],subj:["haya","hayas","haya","hayamos","hayáis","hayan"],future:["habré","habrás","habrá","habremos","habréis","habrán"],conditional:["habría","habrías","habría","habríamos","habríais","habrían"]};

const FUT_ROOT={haber:"habr",caber:"cabr",poder:"podr",querer:"querr",saber:"sabr",poner:"pondr",tener:"tendr",valer:"valdr",venir:"vendr",salir:"saldr",decir:"dir",hacer:"har"};

function impVos(v){let [base,ref]=splitReflexive(v);if(ref){if(base==="ir")return [["vosotros / vosotras","¡idos! / ¡iros!"]];return [["vosotros / vosotras","¡"+base.slice(0,-1)+"os!"]]}return [["vosotros / vosotras","¡"+base.slice(0,-1)+"d!"]]}

function formsFor(v,mode){if(mode==="gerund")return [["Gerundio",gerund(v)]];if(mode==="present")return PERSONS.map((p,i)=>[p,present(v)[i]]);if(mode==="perfect")return PERSONS.map((p,i)=>[p,compound(v,"present")[i]]);if(mode==="indef")return PERSONS.map((p,i)=>[p,indef(v)[i]]);if(mode==="imperfect")return PERSONS.map((p,i)=>[p,imperfect(v)[i]]);if(mode==="pluperfect")return PERSONS.map((p,i)=>[p,compound(v,"imperfect")[i]]);if(mode==="subjPresent")return PERSONS.map((p,i)=>[p,subjPresent(v)[i]]);if(mode==="subjImperfect")return PERSONS.map((p,i)=>[p,subjImperfect(v)[i]]);if(mode==="subjPerfect")return PERSONS.map((p,i)=>[p,compound(v,"subj")[i]]);if(mode==="subjPluperfect")return PERSONS.map((p,i)=>[p,subjPluperfect(v)[i]]);if(mode==="impTu")return impTu(v);if(mode==="impVos")return impVos(v);if(mode==="impUsted")return impUsted(v);if(mode==="impNeg")return impNeg(v);if(mode==="future")return PERSONS.map((p,i)=>[p,future(v)[i]]);if(mode==="futurePerfect")return PERSONS.map((p,i)=>[p,compound(v,"future")[i]]);if(mode==="conditional")return PERSONS.map((p,i)=>[p,conditional(v)[i]]);if(mode==="conditionalPerfect")return PERSONS.map((p,i)=>[p,compound(v,"conditional")[i]]);return []}

const irrPast={sein:["war","warst","war","waren","wart","waren"],haben:["hatte","hattest","hatte","hatten","hattet","hatten"],werden:["wurde","wurdest","wurde","wurden","wurdet","wurden"],gehen:["ging","gingst","ging","gingen","gingt","gingen"],kommen:["kam","kamst","kam","kamen","kamt","kamen"],sehen:["sah","sahst","sah","sahen","saht","sahen"],geben:["gab","gabst","gab","gaben","gabt","gaben"],nehmen:["nahm","nahmst","nahm","nahmen","nahmt","nahmen"],sprechen:["sprach","sprachst","sprach","sprachen","spracht","sprachen"],fahren:["fuhr","fuhrst","fuhr","fuhren","fuhrt","fuhren"],essen:["aß","aßest","aß","aßen","aßt","aßen"],lesen:["las","lasest","las","lasen","last","lasen"],schlafen:["schlief","schliefst","schlief","schliefen","schlieft","schliefen"],bleiben:["blieb","bliebst","blieb","blieben","bliebt","blieben"],finden:["fand","fandest","fand","fanden","fandet","fanden"],helfen:["half","halfst","half","halfen","halft","halfen"],treffen:["traf","trafst","traf","trafen","traft","trafen"],laufen:["lief","liefst","lief","liefen","lieft","liefen"],wissen:["wusste","wusstest","wusste","wussten","wusstet","wussten"],denken:["dachte","dachtest","dachte","dachten","dachtet","dachten"],bringen:["brachte","brachtest","brachte","brachten","brachtet","brachten"]};
const participles={sein:"gewesen",haben:"gehabt",werden:"geworden",gehen:"gegangen",kommen:"gekommen",sehen:"gesehen",geben:"gegeben",nehmen:"genommen",sprechen:"gesprochen",fahren:"gefahren",essen:"gegessen",lesen:"gelesen",schlafen:"geschlafen",bleiben:"geblieben",finden:"gefunden",helfen:"geholfen",treffen:"getroffen",laufen:"gelaufen",wissen:"gewusst",denken:"gedacht",bringen:"gebracht",kaufen:"gekauft",trinken:"getrunken",öffnen:"geöffnet",machen:"gemacht",suchen:"gesucht",spielen:"gespielt",lernen:"gelernt",wohnen:"gewohnt",sagen:"gesagt",arbeiten:"gearbeitet",reisen:"gereist",leben:"gelebt",fallen:"gefallen",schreiben:"geschrieben",singen:"gesungen",sitzen:"gesessen",ziehen:"gezogen",wachsen:"gewachsen",sterben:"gestorben",fliegen:"geflogen",halten:"gehalten",lassen:"gelassen",tragen:"getragen",schmerzen:"geschmerzt",verstehen:"verstanden",helfen:"geholfen",treffen:"getroffen",bleiben:"geblieben",finden:"gefunden",nehmen:"genommen",fahren:"gefahren",bieten:"geboten"};
function germanInf(de){let x=String(de||"").split("/")[0].split(",")[0].replace(/[()]/g,"").trim();let words=x.split(/s+/);let inf=words[words.length-1];if(inf==="werden"&&words.length>1) return "werden";return inf}
function germanPresent(inf){if(irrPresent[inf])return [...irrPresent[inf]];let stem=inf.replace(/en$/,"").replace(/n$/,"");let endings=["e","st","t","en","t","en"];if(/t$|d$/.test(stem))endings=["e","est","et","en","et","en"];return endings.map(e=>stem+e)}
function germanPast(inf){if(irrPast[inf])return [...irrPast[inf]];let stem=inf.replace(/en$/,"").replace(/n$/,"");let ext=/t$|d$/.test(stem)?"ete":"te";return [stem+ext,stem+ext+"st",stem+ext,stem+ext+"n",stem+ext+"t",stem+ext+"n"]}
function germanPart(inf){if(participles[inf])return participles[inf];if(inf.startsWith("be")||inf.startsWith("emp")||inf.startsWith("ent")||inf.startsWith("er")||inf.startsWith("ge")||inf.startsWith("miss")||inf.startsWith("ver")||inf.startsWith("zer"))return inf.endsWith("ieren")?inf.slice(0,-2)+"t":inf.slice(0,-2)+"t";return "ge"+inf.replace(/en$/,"")+"t"}
function germanForms(de,mode){const reflexive=/^sich\\s/.test(String(de||"").trim()),inf=germanInf(de),p=germanPresent(inf),past=germanPast(inf),part=germanPart(inf),haben=["gehen","kommen","fahren","bleiben","reisen","aufwachen","zurückkommen","flüchten","sterben","wachsen"].includes(inf)?"sein":"haben",aux=irrPresent[haben]||germanPresent(haben),auxPast=irrPast[haben]||germanPast(haben),reflex=["mich","dich","sich","uns","euch","sich"];const decorate=forms=>reflexive?forms.map((x,i)=>x+" "+reflex[i]):forms;if(mode==="indef"||mode==="imperfect")return decorate(past);if(mode==="perfect"||mode==="subjPerfect")return decorate(aux.map(a=>a+" "+part));if(mode==="pluperfect"||mode==="subjPluperfect")return decorate(auxPast.map(a=>a+" "+part));if(mode==="future"||mode==="subjPresent"||mode==="subjImperfect"||mode==="subjPluperfect")return ["werde","wirst","wird","werden","werdet","werden"].map(a=>a+" "+inf);if(mode==="futurePerfect")return ["werde","wirst","wird","werden","werdet","werden"].map((a,i)=>a+" "+part+" "+(haben==="sein"?"sein":"haben"));if(mode==="conditional"||mode==="conditionalPerfect")return ["würde","würdest","würde","würden","würdet","würden"].map(a=>mode==="conditional"?a+" "+inf:a+" "+part+" "+(haben==="sein"?"sein":"haben"));if(mode==="gerund")return decorate(["bin gerade am "+inf,"bist gerade am "+inf,"ist gerade am "+inf,"sind gerade am "+inf,"seid gerade am "+inf,"sind gerade am "+inf]);return decorate(p)}
function renderForms(verb,forms,language){const labels=language==="es"?forms.map(x=>x[0]):dePronouns;const vals=language==="es"?forms.map(x=>x[1]):forms;return '<strong>'+esc(verb)+'</strong><div class="form-lines">'+vals.map((x,i)=>'<div class="form-line"><span class="form-person">'+esc(labels[i]||"")+'</span><span class="form-value">'+esc(x)+'</span></div>').join("")+'</div>'}
const select=document.getElementById("topicSelect");let topics=[];
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
let session=null;
async function init(){try{const r=await fetch("grammatik-themen.json",{cache:"no-store"});const d=await r.json();topics=d.topics||[];for(const t of topics){const o=document.createElement("option");o.value=t.id;o.textContent=t.group+" · "+t.title+" ("+t.verbs.length+" Verben)";select.appendChild(o)}select.addEventListener("change",()=>{const t=topics.find(x=>x.id===select.value);document.getElementById("selectionSummary").textContent=t?t.verbs.length+" Verben · "+modeNames[t.mode]:"";document.getElementById("beginBtn").disabled=!t});}catch{document.getElementById("error").textContent="Die Grammatikbereiche konnten nicht geladen werden."}}
function makeRows(topic){return topic.verbs.map(v=>({verb:v.verb,de:v.de,mode:topic.mode,es:formsFor(v.verb,topic.mode),deForms:germanForms(v.de,topic.mode)}))}
function revealCard(card,front,back){card.classList.toggle("is-flipped");card.innerHTML=card.classList.contains("is-flipped")?back:front}
function startTopic(){const topic=topics.find(x=>x.id===select.value);if(!topic)return;session={topic,rows:makeRows(topic),group:0,learned:[],current:[],quiz:[],index:0,wrong:[],phase:"study"};document.getElementById("selectPanel").classList.add("hidden");document.getElementById("studyPanel").classList.remove("hidden");renderStudy()}
function renderStudy(){const s=session,t=s.topic,start=s.group*6,rows=s.rows.slice(start,start+6);s.current=rows;document.getElementById("topicHeading").textContent=t.group+" · "+t.title;document.getElementById("studyProgress").textContent="Stapel "+(s.group+1)+" von "+Math.ceil(s.rows.length/6)+" · "+rows.length+" Karten";const root=document.getElementById("studyCards");root.innerHTML="";for(const r of rows){const b=document.createElement("button");b.className="flashcard";const es=renderForms(r.verb,r.es,"es"),de=renderForms(r.de,r.deForms,"de");b.innerHTML=es;b.addEventListener("click",()=>revealCard(b,es,de));root.appendChild(b)}}
function startQuiz(rows,phase){session.phase=phase;session.quiz=shuffle(rows);session.index=0;session.wrong=[];document.getElementById("studyPanel").classList.add("hidden");document.getElementById("quizPanel").classList.remove("hidden");renderQuiz()}
function renderQuiz(){const r=session.quiz[session.index];if(!r){roundEnd();return}const card=document.getElementById("quizCard");card.classList.remove("is-flipped");card.dataset.flipped="false";card.dataset.es=renderForms(r.verb,r.es,"es");card.dataset.de=renderForms(r.de,r.deForms,"de");card.innerHTML=card.dataset.de;document.getElementById("quizProgress").textContent=(session.phase==="cumulative"?"Gemischte Wiederholung":"Abfrage des Sechserstapels")+" · Karte "+(session.index+1)+" von "+session.quiz.length;document.getElementById("markBtns").classList.add("hidden");document.getElementById("flipBtn").classList.remove("hidden");document.getElementById("feedback").textContent=""}
function flipQuiz(){const c=document.getElementById("quizCard");if(c.dataset.flipped==="true")return;c.dataset.flipped="true";c.classList.add("is-flipped");c.innerHTML=c.dataset.es;document.getElementById("flipBtn").classList.add("hidden");document.getElementById("markBtns").classList.remove("hidden")}
function roundEnd(){if(session.wrong.length){const count=session.wrong.length;document.getElementById("feedback").textContent="Noch "+count+" unsichere Karte"+(count===1?"":"n")+" – nur diese werden gemischt wiederholt.";session.quiz=shuffle(session.wrong);session.index=0;session.wrong=[];setTimeout(renderQuiz,900);return}if(session.phase==="cumulative"){if(session.learned.length<session.rows.length){session.group++;document.getElementById("quizPanel").classList.add("hidden");document.getElementById("studyPanel").classList.remove("hidden");renderStudy()}else finish()}else{session.learned.push(...session.current);if(session.group>0)startQuiz(session.learned,"cumulative");else if(session.learned.length<session.rows.length){session.group++;document.getElementById("quizPanel").classList.add("hidden");document.getElementById("studyPanel").classList.remove("hidden");renderStudy()}else finish()}}
function finish(){document.getElementById("quizPanel").classList.add("hidden");document.getElementById("donePanel").classList.remove("hidden");document.getElementById("doneText").textContent="Alle "+session.rows.length+" Verben aus „"+session.topic.title+"“ wurden abgefragt."}
document.getElementById("beginBtn").addEventListener("click",startTopic);document.getElementById("quizBtn").addEventListener("click",()=>startQuiz(session.current,"group"));document.getElementById("flipBtn").addEventListener("click",flipQuiz);document.getElementById("quizCard").addEventListener("click",flipQuiz);document.getElementById("correctBtn").addEventListener("click",()=>{session.index++;renderQuiz()});document.getElementById("wrongBtn").addEventListener("click",()=>{session.wrong.push(session.quiz[session.index]);session.index++;renderQuiz()});document.getElementById("studyBackBtn").addEventListener("click",()=>location.reload());document.getElementById("doneBackBtn").addEventListener("click",()=>location.reload());document.getElementById("backBtn").addEventListener("click",()=>location.href="uebung.html");
init();
</script></body></html>
